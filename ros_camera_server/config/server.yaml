# The server / client configuration files demonstrate using the camera server
# to transmit a ros2 topic over a streaming protocol and restoring it on the
# client side again as a ros2 topic.
robot: "example_server"
address: "127.0.0.1"
signaling_port: 8443 # For webrtc outputs, the port of the signaling server
cameras:
  example_camera_in:
    name: "Example Camera ROS over RTP Input"
    input:
      type: ros2
      topic: "/camera_server/example"
      framerate: 30/1
      format: jpeg # Supported formats: raw|jpeg|png
    outputs:
      - type: rtp
        codec: h264
        host: 127.0.0.1
        port: 7200
#        bitrate: 800 # in kbps
