# These values are just examples and don't correspond to any real camera or make any sense.
image_width: 1920
image_height: 1080
camera_name: example_camera
camera_matrix:
  rows: 3
  cols: 3
  data: [3.0, 0.0, 160.0, 0.0, 3.0, 120.0, 0.0, 0.0, 1.0]
